name: Website release

# After a release is published in the public releases repo, point the
# website's download buttons at it: update website/public/release.json,
# rebuild website/dist and commit. Vercel redeploys on the push.
#
# Runs only in the development repo (ANI-ML/openbark-dev), like release.yml:
# the public source copy (ANI-ML/openbark) has no PUBLIC_RELEASES_TOKEN, and a
# commit pushed there would be overwritten by the next refresh anyway.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag, e.g. v0.1.0"
        required: true

permissions:
  contents: write

# Two runs at once would race to push to the same branch.
concurrency:
  group: website-release
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'ANI-ML/openbark-dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Passed through the environment, never interpolated into a script.
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::Not a release tag: $TAG (expected e.g. v0.1.0)"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Read the published release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
        run: python scripts/website-release.py "$TAG"
      - name: Rebuild the site
        run: python scripts/website-build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/public/release.json website/dist
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "Website: downloads for $TAG"
          git push
